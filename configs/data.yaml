# Dataset configuration for YOLO training
# People Detection dataset from Roboflow (v12i)
# Source: https://universe.roboflow.com/leo-ueno/people-detection-o4rdr/dataset/12

path: ../People Detection.v12i.yolov8

train: train/images
val: valid/images
test: test/images

